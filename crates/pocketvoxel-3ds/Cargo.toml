[package]
name = "pocketvoxel-3ds"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "pocketvoxel-3ds"
path = "src/main.rs"

[dependencies]
ctru-rs = { git = "https://github.com/rust3ds/ctru-rs.git" }
citro3d = { git = "https://github.com/rust3ds/citro3d-rs.git" }
pocketvoxel-core = { path = "../pocketvoxel-core" }

[features]
# Pokemon Blue: its own dataset (paks/gamedata_blue.json), save
# (save_blue.lua) and title ribbon overlay, over the SAME shared paks Red
# reads. `cargo 3ds build --release --features blue`.
blue = []
# Pokemon Yellow: its own pak set (paks_yellow/), dataset and save
# (save_yellow.lua). `cargo 3ds build --release --features yellow`.
yellow = []
# The Gen 2 engine (game-gold.js) and the host behaviour that goes with it;
# turned on by gold, silver and crystal, not asked for on its own.
gen2 = []
# Pokemon Gold: Gen 2 -- its own pak set (paks_gold/), dataset and save
# (save_gold.lua). `cargo 3ds build --release --features gold`.
gold = ["gen2"]
# Pokemon Silver: Gen 2, sharing Gold's pak set (paks_gold/) the way Blue
# shares Red's, with its own dataset (gamedata_silver.json), overlay
# (version_silver.vxat) and save (save_silver.lua).
silver = ["gen2"]
# Pokemon Crystal: Gen 2 -- its own pak set (paks_crystal/: two-bank
# tilesets, its own maps and palettes), dataset and save (save_crystal.lua).
crystal = ["gen2"]
# The Gen 3 engine (game-firered.js), its host loop and display (src/gen3/,
# GPLv3 + additional terms) and the core's M4A sound engine; turned on by
# firered, not asked for on its own. The MIT games never compile any of it.
gen3 = ["pocketvoxel-core/gen3"]
# FireRed: Gen 3. `cargo 3ds build --release --features firered`.
firered = ["gen3"]

[build-dependencies]
cc = "1"
